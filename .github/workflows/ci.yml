name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run smoke tests
        run: cd server && pip install -r requirements.txt && python test_smoke.py
      - name: Run TLS smoke test
        run: cd server && python test_tls.py

  # No Cloudflare Workers job here on purpose: wrangler dev requires a logged-in
  # wrangler account, which CI does not have. Workers are tested locally instead:
  # start `npx wrangler dev --port 8787` in server-workers/, then run
  # `python test_smoke.py` from server-workers/.

  android:
    name: Android build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build APKs
        run: cd android && ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apks
          path: android/app/build/outputs/apk/**/*.apk
